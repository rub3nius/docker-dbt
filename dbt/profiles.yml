default:
  outputs:
    dev:
      type: sqlserver
      driver: 'ODBC Driver 18 for SQL Server'
      host: sqlserver
      port: 1433
      user: sa
      password: "{{ env_var('DBT_ENV_SECRET_PASSWORD') }}"
      database: master
      schema: dbo
      encrypt: true
      trust_cert: true
  target: dev